experiment_group: video-ocl
experiment_name: movi_d_gcv1_rescue15k
seed: 42

# Round 3 Codex rescue cell C1-A1: LoRA-only with TWO stability fixes:
#   (1) Separate LoRA param group at lr=4e-5 (10x reduction vs main 4e-4).
#   (2) Frozen featrec target via target_encoder (pretrained DINOv2, no LoRA).
#
# Round 2 C1 (no fixes): collapsed between val@5128 (fg_ari=0.497 healthy)
# and val@7692 (fg_ari=0.014, loss_ss=4.09 ceiling, featrec=0.09 trivial
# target). Codex smoking gun: LoRA makes the featrec target trivial because
# the target IS the LoRA-modified backbone — moving-target collapse mode.
#
# Fix 1 (lower LoRA LR): 4e-5 = 0.1x main LR, standard LoRA practice.
#   Non-LoRA encoder params (output_transform, pos_embed) keep 4e-4.
# Fix 2 (frozen featrec target): target_encoder is a separate frozen
#   DINOv2 run with no LoRA. featrec auto-targets target_encoder.backbone_features
#   per models.py:95-98.
#
# Kill (Codex Round 3 Q5):
#   C1-A1 fg_ari < 0.30 → LoRA training protocol is broken, pivot to Path B.
#   C1-A1 fg_ari >= 0.45 → LoRA stability is rescued; TubeGram test via C4-A1.

globals:
  NUM_SLOTS: 15
  SLOT_DIM: 128
  DINO_MODEL: vit_base_patch14_dinov2
  FEAT_DIM: 768
  NUM_PATCHES: 576
  NUM_GPUS: 1
  BATCH_SIZE_PER_GPU: 8
  TOTAL_BATCH_SIZE: "${mul: ${.NUM_GPUS}, ${.BATCH_SIZE_PER_GPU}}"
  BASE_LR: 0.0001
  SIM_TEMP: 0.075
  SIM_WEIGHT: 0.1

trainer:
  max_steps: 15000
  log_every_n_steps: 100
  val_check_interval: 2500
  gradient_clip_val: 0.05

optimizer:
  name: Adam
  # Global lr placeholder (used when a param group omits its own lr).
  lr: 0.0004
  param_groups:
    # Group 1: LoRA adapters at 0.1x reduced LR (stability fix).
    - modules: encoder
      include: "lora_"
      lr: 0.00004
      lr_scheduler:
        name: exp_decay_with_warmup
        warmup_steps: 2500
        decay_steps: 15000
    # Group 2: non-LoRA encoder params (output_transform, pos_embed) at full LR.
    - modules: encoder
      exclude: "lora_"
      lr: 0.0004
      lr_scheduler:
        name: exp_decay_with_warmup
        warmup_steps: 2500
        decay_steps: 15000
    # Group 3: slot-side modules at full LR.
    - modules: [initializer, processor, decoder]
      lr: 0.0004
      lr_scheduler:
        name: exp_decay_with_warmup
        warmup_steps: 2500
        decay_steps: 15000

model:
  input_type: video
  visualize: false
  visualize_every_n_steps: 10000
  use_backbone_features: false
  temporal_cross_window: 0
  temporal_cross_mode: "both"

  # target_encoder_input set → featrec default target auto-switches to
  # target_encoder.backbone_features (frozen pretrained DINOv2 features).
  # Omit pos_embed / output_transform: only backbone_features is consumed,
  # so carrying unused random-init heads is dead weight (and noisy in
  # preflight requires_grad checks).
  target_encoder_input: video
  target_encoder:
    backbone:
      name: TimmExtractor
      model: ${globals.DINO_MODEL}
      features:
      - vit_block12
      - vit_block_keys12
      frozen: true
      pretrained: true
      model_kwargs:
        dynamic_img_size: True
    use_pos_embed: false

  # Phase schedule (C1 baseline: no teacher, no aux losses; only LoRA unfreeze).
  ema_teacher:
    decay: 0.0
    backbone_unfreeze_step: 5000
    loss_ramp_steps: 0

  losses:
    loss_featrec:
      name: MSELoss
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_ss:
      name: Slot_Slot_Contrastive_Loss
      pred_key: processor.state
      temperature: 0.1
      batch_contrast: true
      patch_inputs: false
      keep_input_dim: true
  loss_weights:
    loss_featrec: 1.0
    loss_ss: 0.5

  initializer:
    name: GreedyFeatureInit
    n_slots: ${globals.NUM_SLOTS}
    dim: ${globals.SLOT_DIM}
    saliency_mode: local_consistency
    neighbor_radius: 1
    selection_mode: hard
    refine_linear: false
    refine_hidden: 0
    saliency_alpha: 0.5
    spatial_suppression_radius: 0
    spatial_suppression_strength: 0.5
    soft_topk: 5
    temperature: 0.1
    neighbor_avg_radius: 1
    saliency_smoothing: 0
    init_mode: first_frame
    aggregate: false
    aggregate_threshold: 0.5
    init_threshold: 0.0
    min_slots: 1
    cluster_method: agglomerative
    affinity: cosine
    linkage: average

  encoder:
    backbone:
      name: TimmExtractor
      model: ${globals.DINO_MODEL}
      features:
      - vit_block12
      - vit_block_keys12
      frozen: false
      pretrained: true
      model_kwargs:
        dynamic_img_size: True
      lora_config:
        r: 8
        alpha: 16.0
        target_modules: ["attn.qkv", "attn.proj"]
    use_pos_embed: false
    pos_embed:
      name: utils.FourierPositionEmbed3D
      dim: ${globals.FEAT_DIM}
      patch_size: 14
      num_bands: 64
    output_transform:
      name: networks.two_layer_mlp
      inp_dim: ${globals.FEAT_DIM}
      outp_dim: ${globals.SLOT_DIM}
      hidden_dim: "${mul: ${globals.FEAT_DIM}, 2}"
      layer_norm: true

  grouper:
    name: SlotAttention
    inp_dim: ${globals.SLOT_DIM}
    slot_dim: ${globals.SLOT_DIM}
    n_iters: 2
    use_mlp: true
    use_gru: true
    use_ttt: false
    use_gated: false
    use_ent: false

  latent_processor:
    first_step_corrector_args:
      n_iters: 3
    use_ttt3r: false
    skip_corrector: false
    skip_predictor: false

  decoder:
    name: MLPDecoder
    inp_dim: ${globals.SLOT_DIM}
    outp_dim: ${globals.FEAT_DIM}
    hidden_dims: [1024, 1024, 1024]
    n_patches: ${globals.NUM_PATCHES}

  predictor:
    name: networks.HungarianPredictor
    dim: ${globals.SLOT_DIM}
    n_blocks: 1
    n_heads: 4
    use_gated: false
    similarity: cosine
    pre_match: false
    max_slots: ${globals.NUM_SLOTS}
    match_threshold: 2.0
    ema_decay: 0.0
    use_hybrid_cost: false
    use_kalman: false
    kalman_process_noise: 0.03
    lambda_pos: 1.0
    lambda_angular: 0.0
    lambda_iou: 1.0
    use_velocity: true
    velocity_ema: 0.5
    use_iterative: false

val_metrics:
  ari:
    name: VideoARI
    ignore_background: true
    pred_key: decoder_masks_hard
    true_key: segmentations
  fg_ari:
    name: VideoARI
    ignore_background: true
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_ari:
    name: ImageARI
    ignore_background: true
    video_input: true
    pred_key: decoder_masks_hard
    true_key: segmentations
  mbo:
    name: VideoIoU
    matching: overlap
    ignore_background: true
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_mbo:
    name: ImageIoU
    matching: overlap
    ignore_background: true
    video_input: true
    pred_key: decoder_masks_hard
    true_key: segmentations

dataset:
  train_shards: "movi_d/movi_d-train-{000000..000304}.tar"
  val_shards: "movi_d/movi_d-validation-{000000..000007}.tar"
  batch_size: ${globals.BATCH_SIZE_PER_GPU}
  val_batch_size: 4
  val_size: 250
  num_workers: 4
  num_val_workers: 2
  train_pipeline:
    video_size: 24
    chunk_size: 4
    sample_one_chunk_per_video: true
    keys: [video]
    shuffle_size: 512
    transforms:
      name: movi_train
      type: video
      input_size: 336
      h_flip_prob: 0.5
  val_pipeline:
    use_chunks: false
    keys: [video, segmentations]
    transforms:
      name: movi_val
      type: video
      input_size: 336
      num_classes: 24
