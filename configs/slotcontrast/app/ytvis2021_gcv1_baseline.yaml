experiment_group: video-ocl
experiment_name: ytvis2021_gcv1_baseline
seed: 42

globals:
  NUM_SLOTS: 7
  SLOT_DIM: 64
  # DINOv2
  DINO_MODEL: vit_base_patch14_dinov2 # vit_large_patch14_dinov2.lvd142m
  NUM_PATCHES: 1369
  # DINOv3
  # DINO_MODEL: vit_base_patch16_dinov3 / vit_large_patch16_dinov3.lvd1689m
  # NUM_PATCHES: 1024
  FEAT_DIM: 768 # 1024 for vit_large
  NUM_GPUS: 1
  BATCH_SIZE_PER_GPU: 8
  TOTAL_BATCH_SIZE: "${mul: ${.NUM_GPUS}, ${.BATCH_SIZE_PER_GPU}}"
  BASE_LR: 0.0001
  # === VideoSAUR baseline (uncomment when running VideoSAUR) ===
  SIM_TEMP: 0.15
  SIM_WEIGHT: 0.1

trainer:
  max_steps: 100000
  log_every_n_steps: 250
  val_check_interval: 2500
  gradient_clip_val: 0.05

optimizer:
  name: Adam
  lr: 0.0008
  lr_scheduler:
    name: exp_decay_with_warmup
    warmup_steps: 2500
    decay_steps: ${trainer.max_steps}

model:
  input_type: video
  visualize: false
  visualize_every_n_steps: 10000
  use_backbone_features: false  # Use stable DINO features for greedy init
  temporal_cross_window: 0  # 0=same-frame cycle, 0<=temporal cross-consistency<=chunk_size-1
  temporal_cross_mode: "both"  # or "backward" or "forward"
  # ============== GCv1 losses (GreedyFeatureInit + slot-slot contrastive) ==============
  losses:
    loss_featrec:
      name: MSELoss
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_ss:
      name: Slot_Slot_Contrastive_Loss
      pred_key: processor.state
      temperature: 0.1
      batch_contrast: true
      patch_inputs: false
      keep_input_dim: true
  loss_weights:
    loss_featrec: 1.0
    loss_ss: 0.5

  initializer:
    name: GreedyFeatureInit
    n_slots: ${globals.NUM_SLOTS}
    dim: ${globals.SLOT_DIM}
    saliency_mode: local_consistency  # 'norm', 'entropy', 'variance', 'pca', 'local_consistency', 'local_consistency_pca', 'local_consistency_ms', 'local_consistency_uniform', 'local_consistency_centroid', 'local_consistency_balanced', 'local_consistency_soft', 'local_consistency_density', 'local_consistency_second', 'local_consistency_gaussian'
    neighbor_radius: 2
    selection_mode: hard # hard, soft, neighbor_avg, knn_refine, centroid
    refine_linear: false  # Enable learnable refinement
    refine_hidden: 0
    saliency_alpha: 0.5    # Try: 0.5, 0.7, 1.0, 1.3, 1.5
    spatial_suppression_radius: 0      # 1=3x3, 2=5x5, 3=7x7
    spatial_suppression_strength: 0.5  # 0=pure feature, 1=pure spatial
    soft_topk: 5
    temperature: 0.1 
    neighbor_avg_radius: 1
    saliency_smoothing: 0 # 0=no smoothing, 1=3x3, 2=5x5, 3=7x7, etc.
    init_mode: first_frame  # per_frame or first_frame
    aggregate: false           # Enable patch aggregation
    aggregate_threshold: 0.5  # Include patches with sim > 0.5
    # === V2-specific: Variable slot support ===
    init_threshold: 0.0        # Early stopping threshold (0=disabled, try 0.1-0.3)
    min_slots: 1               # Minimum slots before early stopping applies
    # === Clustering (ClusterFeatureInit only) ===
    cluster_method: agglomerative
    affinity: cosine
    linkage: average

  encoder:
    backbone:
      name: TimmExtractor
      model: ${globals.DINO_MODEL}
      features: [vit_block12, vit_block_keys12]  # VideoSAUR: [vit_block12, vit_block_keys12]
      # features: vit_output
      frozen: true
      pretrained: true
      model_kwargs:
        dynamic_img_size: true
    use_pos_embed: false
    pos_embed:
      name: utils.LearnedPositionEmbed # CoordinatePositionEmbed RotaryPositionEmbed
      dim: ${globals.FEAT_DIM}
      n_patches: ${globals.NUM_PATCHES}
    output_transform:
      name: networks.two_layer_mlp
      inp_dim: ${globals.FEAT_DIM}
      outp_dim: ${globals.SLOT_DIM}
      hidden_dim: "${mul: ${globals.FEAT_DIM}, 2}"
      layer_norm: true
    main_features_key: vit_block12
    normalize_features: false      # Enable normalization
    normalization_type: "l2"      # or "standardize"

  grouper:
    name: SlotAttention
    inp_dim: ${globals.SLOT_DIM}
    slot_dim: ${globals.SLOT_DIM}
    n_iters: 2
    use_mlp: true    # Paper Appendix A.1: GRU + MLP slot update
    use_gru: true
    use_ttt: false
    use_gated: false
    use_ent: false

  latent_processor:
    first_step_corrector_args:
      n_iters: 3
    # TTT3R: Adaptive state update based on predictor attention (default: false)
    use_ttt3r: false
    skip_corrector: false  # Bypass slot attention, use greedy-initialized slots directly
    skip_predictor: false  # Bypass predictor, use greedy-initialized slots directly
    
    # ============== MEMORY SYSTEM (Optional) ==============
    # Uncomment the following sections to enable SAM2-style temporal memory
    # This stores past frame information to improve temporal consistency
    
    # memory_encoder:
    #   name: SlotMemoryEncoder            # Note: imported in modules/__init__.py
    #   slot_dim: ${globals.SLOT_DIM}      # Slot feature dimension
    #   feat_dim: ${globals.SLOT_DIM}      # Encoder feature dimension
    #   mem_dim: ${globals.SLOT_DIM}       # Memory representation dimension
    #   n_slots: ${globals.NUM_SLOTS}      # Number of slots per frame
    #   fusion_blocks: 1                   # Number of transformer fusion layers
    #   dropout: 0.0                       # Dropout rate
    
    # memory_bank:
    #   name: MemoryBank                   # Note: imported in modules/__init__.py
    #   capacity: 7                        # Max frames to store (FIFO queue)
    #   mem_dim: ${globals.SLOT_DIM}       # Memory feature dimension
    #   temporal_stride_eval: 1            # Temporal stride during evaluation
    # ======================================================

  # Paper Table 8: Decoder Type = MLP
  decoder:
    name: MLPDecoder
    inp_dim: ${globals.SLOT_DIM}
    outp_dim: ${globals.FEAT_DIM}
    hidden_dims: [1024, 1024, 1024]
    n_patches: ${globals.NUM_PATCHES}

  # Paper Table 8: Temporal Correspondence = Hungarian (0 learnable params, post-match)
  predictor:
    name: networks.HungarianPredictor
    dim: ${globals.SLOT_DIM}
    n_blocks: 1
    n_heads: 4
    use_gated: false
    # === HungarianPredictor / HungarianMemoryMatcher options ===
    similarity: cosine         # 'cosine' or 'l2'
    pre_match: false           # Match BEFORE slot attention (HungarianPredictor only)
    # === HungarianMemoryMatcher V2 options (persistent tracking) ===
    max_slots: ${globals.NUM_SLOTS}  # Fixed registry capacity
    match_threshold: 2.0       # Cosine distance threshold for valid match (lower=stricter)
    ema_decay: 0.0             # EMA weight: new = decay*old + (1-decay)*current
    
    # === Hybrid Cost Matching (Optional - requires GreedyFeatureInit) ===
    # Combines appearance, position (centroid), and angular (motion) costs
    # Requires initializer.name = GreedyFeatureInit or GreedyFeatureInitV2
    use_hybrid_cost: false      # Enable hybrid cost matching
    use_kalman: false
    kalman_process_noise: 0.03
    lambda_pos: 1.0            # Weight for position (centroid distance) cost
    lambda_angular: 1.0        # Weight for angular (motion consistency) cost
    lambda_iou: 1.0      # Feature-independent spatial matching
    use_velocity: true
    velocity_ema: 0.5    # 0=no smoothing, 1=constant velocity
    use_iterative: false
    
    # ============== MEMORY-CONDITIONED PREDICTOR (Optional) ==============
    # Uncomment to use memory-conditioned predictor with cross-attention
    # NOTE: If using memory, also uncomment memory_encoder and memory_bank above
    
    # name: networks.MemoryConditionedTransformer
    # dim: ${globals.SLOT_DIM}              # Slot dimension
    # memory_dim: ${globals.SLOT_DIM}       # Memory dimension
    # n_blocks: 1                           # Number of transformer blocks
    # n_heads: 4                            # Number of attention heads
    # use_memory: true                      # Enable/disable cross-attention (for ablation)
    # dropout: 0.0                          # Dropout rate
    # activation: relu                      # Activation function
    # =====================================================================

val_metrics:
  ari:
    name: VideoARI
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  fg_ari:
    name: VideoARI
    ignore_background: true
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_ari:
    name: ImageARI
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  mbo:
    name: VideoIoU
    matching: overlap
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_mbo:
    name: ImageIoU
    matching: overlap
    video_input: true
    ignore_background: false
    pred_key: decoder_masks_hard
    true_key: segmentations

dataset:
  train_shards: "ytvis2021_resized/ytvis-train-{000000..000083}.tar"
  val_shards: "ytvis2021_resized/ytvis-validation-{000000..000029}.tar"
  batch_size: ${globals.BATCH_SIZE_PER_GPU}
  val_batch_size: 1
  val_size: 200
  num_workers: 4
  num_val_workers: 1
  # Phase-1 weak-supervision toggle. Default omitted for backward compat (the
  # train stream then keeps only the keys listed in `train_pipeline.keys`).
  # When set, this overrides the train-side filter so segmentations and
  # track_ids sidecars (re-sharded per data/save_ytvis2021.py) reach the loop.
  # train_keys: [video, segmentations, track_ids]
  train_pipeline:
    chunk_size: 4
    # `keys` here lists tensors that are split along the temporal axis (frames).
    # Default (Table A / unsupervised): only `video`. For Table B (weakly
    # supervised) also list `segmentations` here so it is chunked frame-wise.
    # Do NOT list `track_ids` here — it is a per-video [32] vector that should
    # be repeated across chunks, not split. To let `track_ids` reach the loop,
    # set `dataset.train_keys: [video, segmentations, track_ids]` above.
    keys: [video]
    # For 3D pos embed, uncomment below and comment above:
    # keys: [video, depths, intrinsics, extrinsics]
    # Stride-2 long-clip schedule (round-18). Default 1 = contiguous.
    frame_stride: 1
    sample_one_chunk_per_video: true
    transforms:
      name: ytvis_train
      type: video
      crop_type: short_side_resize_random
      # DINOv2
      input_size: 518
      # DINOv3
      # input_size: 512
      # YT-VIS 2021 max K_video ~ 30; pad to fixed cap of 32 (safe for
      # batched collation of `segmentations`). Required when add_segmentations: true.
      num_classes: 32
      # Set true on Table B configs so the train stream materializes the
      # `segmentations` tensor (track_ids passes through as raw int32).
      add_segmentations: false
      use_3d_pos_embed: false  # Enable camera data transforms
  val_pipeline:
    use_chunks: false
    keys: [video, segmentations]
    # For 3D pos embed, uncomment below and comment above:
    # keys: [video, segmentations, depths, intrinsics, extrinsics]
    transforms:
      name: ytvis_val
      type: video
      crop_type: central
      # DINOv2
      input_size: 518
      # DINOv3
      # input_size: 512
      num_classes: 25
      use_3d_pos_embed: false  # Enable camera data transforms