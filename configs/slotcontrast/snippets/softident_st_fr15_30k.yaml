# Round-32 fairness audit: ST-SoftIdent+fr15 at 30K (catch-up test).
#
# Codex MCP F6: "Does Hungarian+fr15 catch up to ST+fr15 with more training?"
# Run ST+fr15 and Hung+fr15 at 30K matched schedule on the post-hoc-flagged
# SC YT-VIS cell (codex F7).
trainer:
  max_steps: 30000
optimizer:
  lr_scheduler:
    name: exp_decay_with_warmup
    warmup_steps: 2500
    decay_steps: 30000
model:
  latent_processor:
    skip_predictor: false
  predictor:
    name: networks.SoftIdentityPredictor
    dim: ${globals.SLOT_DIM}
    sinkhorn_iters: 5
    sinkhorn_tau: 0.1
    cosine_weight: 1.0
    use_flow_iou: false
    flow_iou_weight: 0.0
    use_centroid_dist: false
    straight_through: true
  loss_weights:
    loss_featrec: 1.5
    loss_ss: 0.5
