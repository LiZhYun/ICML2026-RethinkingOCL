# Round-24 escalation: Fix #1 (frozen-greedy-init) + 100× lower LoRA LR.
# Combined override snippet for movic GCv1+per_frame+rescue test.
model:
  initializer_feature_source: target_encoder
optimizer:
  param_groups:
    - modules: encoder
      include: "lora_"
      lr: 0.000004
      lr_scheduler:
        name: exp_decay_with_warmup
        warmup_steps: 2500
        decay_steps: 15000
    - modules: encoder
      exclude: "lora_"
      lr: 0.0004
      lr_scheduler:
        name: exp_decay_with_warmup
        warmup_steps: 2500
        decay_steps: 15000
    - modules: [initializer, processor, decoder]
      lr: 0.0004
      lr_scheduler:
        name: exp_decay_with_warmup
        warmup_steps: 2500
        decay_steps: 15000
