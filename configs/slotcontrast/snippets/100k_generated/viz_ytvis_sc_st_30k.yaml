model:
  latent_processor:
    skip_predictor: false
  loss_weights:
    loss_featrec: 1.5
    loss_ss: 0.5
  predictor:
    cosine_weight: 1.0
    dim: ${globals.SLOT_DIM}
    flow_iou_weight: 0.0
    name: networks.SoftIdentityPredictor
    sinkhorn_iters: 5
    sinkhorn_tau: 0.1
    straight_through: true
    use_centroid_dist: false
    use_flow_iou: false
optimizer:
  param_groups:
  - include: lora_
    lr: 8.0e-05
    lr_scheduler:
      decay_steps: 30000
      name: exp_decay_with_warmup
      warmup_steps: 2500
    modules: encoder
  - exclude: lora_
    lr: 0.0008
    lr_scheduler:
      decay_steps: 30000
      name: exp_decay_with_warmup
      warmup_steps: 2500
    modules: encoder
  - lr: 0.0008
    lr_scheduler:
      decay_steps: 30000
      name: exp_decay_with_warmup
      warmup_steps: 2500
    modules:
    - initializer
    - processor
    - decoder
trainer:
  max_steps: 30000
