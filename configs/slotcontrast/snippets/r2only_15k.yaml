# R2-only override (T1d). target_encoder kept; no R1, no R3.
# Inherits optimizer.lr from base config.
optimizer:
  param_groups: null
  lr_scheduler:
    name: exp_decay_with_warmup
    warmup_steps: 2500
    decay_steps: 15000
model:
  ema_teacher:
    decay: 0.0
    backbone_unfreeze_step: 0
    loss_ramp_steps: 0
