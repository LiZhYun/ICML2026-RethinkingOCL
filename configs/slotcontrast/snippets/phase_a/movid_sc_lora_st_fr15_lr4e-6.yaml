# Phase-A Round-34 FIX-12-redo: MOVi-D × SC × LoRA-rescue (ST-SoftIdent + featrec=1.5)
# × encoder LoRA lr=4e-6 (10× lower than canonical 4e-5).
# Round-33 codex caught that the original FIX-12 snippet inherited the base config's
# native predictor (TransformerEncoder) + featrec=1.0 — not the rescue scaffold.
# This redo explicitly overrides predictor → SoftIdentityPredictor and
# loss_featrec → 1.5, so the LR sweep is apples-to-apples with the v2 `_st_`
# canonical LoRA-rescue cell (lr=4e-5) and tuned fullft@1e-5 cells.
model:
  latent_processor:
    skip_predictor: false
  predictor:
    name: networks.SoftIdentityPredictor
    dim: ${globals.SLOT_DIM}
    sinkhorn_iters: 5
    sinkhorn_tau: 0.1
    cosine_weight: 1.0
    use_flow_iou: false
    flow_iou_weight: 0.0
    use_centroid_dist: false
    straight_through: true
  loss_weights:
    loss_featrec: 1.5
    loss_ss: 0.5
optimizer:
  param_groups:
  - modules: encoder
    include: "lora_"
    lr: 4.0e-06
    lr_scheduler:
      name: exp_decay_with_warmup
      warmup_steps: 2500
      decay_steps: 100000
  - modules: encoder
    exclude: "lora_"
    lr: 0.0004
    lr_scheduler:
      name: exp_decay_with_warmup
      warmup_steps: 2500
      decay_steps: 100000
  - modules: [initializer, processor, decoder]
    lr: 0.0004
    lr_scheduler:
      name: exp_decay_with_warmup
      warmup_steps: 2500
      decay_steps: 100000
trainer:
  max_steps: 100000
