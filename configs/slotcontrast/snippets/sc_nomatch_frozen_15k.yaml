# SC frozen + no matching: drops LoRA/R2/R3 + bypasses TransformerEncoder predictor.
# Joint control for "matching redundant under DINOv2" thesis on SC.
optimizer:
  param_groups: null
  lr_scheduler:
    name: exp_decay_with_warmup
    warmup_steps: 2500
    decay_steps: 15000
model:
  encoder:
    backbone:
      frozen: true
      lora_config: null
  target_encoder: null
  target_encoder_input: null
  ema_teacher:
    decay: 0.0
    backbone_unfreeze_step: 0
    loss_ramp_steps: 0
  latent_processor:
    skip_predictor: true
