# Round-24 Round-6 codex prescription: SoftIdent-cosine + featrec_weight 1.5×.
#
# Codex Round-6 verdict on the 6×4×4 ablation:
# - Universal 16/16 NOT achieved by any tested variant.
# - SoftIdent-cosine is the best single config (7/16 positive cells) but
#   trails frozen on MOVi-C/MOVi-D, with mbo/imbo as the consistent tail.
# - Centroid (strong+weak) hurts more than helps on D/E/Y.
#
# Hypothesis: tighter feature anchoring (loss_featrec 1.0 → 1.5) may close
# the mbo/imbo tail and reduce MOVi-C drift WITHOUT imposing a bad spatial
# prior. Stops chasing motion-aware mechanisms and instead amplifies the
# existing frozen-target featrec signal that's already working.
model:
  latent_processor:
    skip_predictor: false
  predictor:
    name: networks.SoftIdentityPredictor
    dim: ${globals.SLOT_DIM}
    sinkhorn_iters: 5
    sinkhorn_tau: 0.1
    cosine_weight: 1.0
    use_flow_iou: false
    flow_iou_weight: 0.0
    use_centroid_dist: false
  loss_weights:
    loss_featrec: 1.5
    loss_ss: 0.5
