# Phase-B T3.1: YT-VIS BitFit. Same as bitfit_st_fr15.yaml but with YT-VIS
# LRs (8e-5 / 8e-4) matched to YT-VIS LoRA-rescue config.
model:
  encoder:
    backbone:
      frozen: true
      lora_config: null
      adapt_mode: bitfit
  latent_processor:
    skip_predictor: false
  predictor:
    name: networks.SoftIdentityPredictor
    dim: ${globals.SLOT_DIM}
    sinkhorn_iters: 5
    sinkhorn_tau: 0.1
    cosine_weight: 1.0
    use_flow_iou: false
    flow_iou_weight: 0.0
    use_centroid_dist: false
    straight_through: true
  loss_weights:
    loss_featrec: 1.5
    loss_ss: 0.5
  ema_teacher:
    decay: 0.0
    backbone_unfreeze_step: 0
    loss_ramp_steps: 0
trainer:
  max_steps: 100000
optimizer:
  param_groups:
  - modules: encoder
    include: bias
    lr: 8.0e-05
    lr_scheduler:
      name: exp_decay_with_warmup
      warmup_steps: 2500
      decay_steps: 100000
  - modules:
    - initializer
    - processor
    - decoder
    lr: 0.0008
    lr_scheduler:
      name: exp_decay_with_warmup
      warmup_steps: 2500
      decay_steps: 100000
