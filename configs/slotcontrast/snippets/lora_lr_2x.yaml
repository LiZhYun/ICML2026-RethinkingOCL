# LoRA LR 2x main = 0.5× main (much higher than rescue defaults). Tests if
# LoRA needs aggressive training to actually adapt features.
optimizer:
  param_groups:
    - modules: encoder
      include: "lora_"
      lr: 0.0002
      lr_scheduler:
        name: exp_decay_with_warmup
        warmup_steps: 2500
        decay_steps: 15000
    - modules: encoder
      exclude: "lora_"
      lr: 0.0004
      lr_scheduler:
        name: exp_decay_with_warmup
        warmup_steps: 2500
        decay_steps: 15000
    - modules: [initializer, processor, decoder]
      lr: 0.0004
      lr_scheduler:
        name: exp_decay_with_warmup
        warmup_steps: 2500
        decay_steps: 15000
