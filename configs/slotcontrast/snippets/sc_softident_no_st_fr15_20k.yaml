# Round-32 fairness audit: SC + SoftIdent (NO ST) + fr=1.5 at 20K.
#
# For step-aligned SC YT-VIS comparison: SC SoftIdent (no-ST) + fr=1.5 must
# match the treatment's 20K schedule (mx=20000, decay_steps=15000).
trainer:
  max_steps: 20000
model:
  latent_processor:
    skip_predictor: false
  predictor:
    name: networks.SoftIdentityPredictor
    dim: ${globals.SLOT_DIM}
    sinkhorn_iters: 5
    sinkhorn_tau: 0.1
    cosine_weight: 1.0
    use_flow_iou: false
    flow_iou_weight: 0.0
    use_centroid_dist: false
    straight_through: false
  loss_weights:
    loss_featrec: 1.5
    loss_ss: 0.5
