# Round-32 fairness audit: ST-SoftIdent+fr15 at 20K (for n=5 SC YT-VIS pair).
#
# Existing 20K runs at 2026-05-01-00-28-* are seeds 42, 1, 2. To upgrade
# SC YT-VIS to n=5, also run with seeds 3 and 4. Schedule: mx=20000,
# decay_steps=15000 to match the original treatment.
trainer:
  max_steps: 20000
model:
  latent_processor:
    skip_predictor: false
  predictor:
    name: networks.SoftIdentityPredictor
    dim: ${globals.SLOT_DIM}
    sinkhorn_iters: 5
    sinkhorn_tau: 0.1
    cosine_weight: 1.0
    use_flow_iou: false
    flow_iou_weight: 0.0
    use_centroid_dist: false
    straight_through: true
  loss_weights:
    loss_featrec: 1.5
    loss_ss: 0.5
